name: Pipeline

on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    uses: davidsugianto/shared-workflows/.github/workflows/go-docker-ci.yaml@master
    with:
      go-version: "1.25"
      image-name: docker.io/idiots718/go-http-server
      run-tests: false
      push-image: ${{ github.event_name != 'pull_request' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    uses: davidsugianto/shared-workflows/.github/workflows/kustomize-image-tag.yaml@master
    with:
      gitops-repo: davidsugianto/idp-gitops-manifests
      image: docker.io/idiots718/go-http-server
      tag: ${{ needs.build.outputs.image-tag }}
      kustomize-path: environments/dev/go-http-server
      create-pr: true
    secrets:
      git-token: ${{ secrets.PAT_TOKEN }}

  deploy-staging:
    needs: build
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: davidsugianto/shared-workflows/.github/workflows/kustomize-image-tag.yaml@master
    with:
      gitops-repo: davidsugianto/idp-gitops-manifests
      image: docker.io/idiots718/go-http-server
      tag: ${{ needs.build.outputs.image-tag }}
      kustomize-path: environments/staging/go-http-server
      create-pr: true
    secrets:
      git-token: ${{ secrets.PAT_TOKEN }}

  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: davidsugianto/shared-workflows/.github/workflows/kustomize-image-tag.yaml@master
    with:
      gitops-repo: davidsugianto/idp-gitops-manifests
      image: docker.io/idiots718/go-http-server
      tag: ${{ needs.build.outputs.image-tag }}
      kustomize-path: environments/prod/go-http-server
      create-pr: true
    secrets:
      git-token: ${{ secrets.PAT_TOKEN }}
