name: Pipeline

on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - master
      - main

env:
  SERVICE_NAME: go-http-server
  REGISTRY: docker.io/idiots718

jobs:
  build:
    uses: davidsugianto/shared-workflows/.github/workflows/go-docker-ci.yaml@master
    with:
      go-version: "1.25"
      image-name: ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}
      run-tests: false
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  deploy-staging:
    needs: build
    if: startsWith(github.ref, 'refs/heads/release/')
    uses: davidsugianto/shared-workflows/.github/workflows/kustomize-image-tag.yaml@master
    with:
      gitops-repo: davidsugianto/idp-gitops-manifests
      image: ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}
      tag: staging-latest
      kustomize-path: environments/staging/${{ env.SERVICE_NAME }}
      create-pr: true
    secrets:
      git-token: ${{ secrets.PAT_TOKEN }}

  deploy-prod:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: davidsugianto/shared-workflows/.github/workflows/kustomize-image-tag.yaml@master
    with:
      gitops-repo: davidsugianto/idp-gitops-manifests
      image: ${{ env.REGISTRY }}/${{ env.SERVICE_NAME }}
      tag: ${{ github.ref_name }}
      kustomize-path: environments/prod/${{ env.SERVICE_NAME }}
      create-pr: true
    secrets:
      git-token: ${{ secrets.PAT_TOKEN }}
