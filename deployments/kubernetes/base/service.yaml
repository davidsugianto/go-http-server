apiVersion: v1
kind: Service
metadata:
  name: go-http-server
  namespace: go-http-server
  labels:
    app.kubernetes.io/name: go-http-server
    app.kubernetes.io/component: api-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: go-http-server
    app.kubernetes.io/component: api-server
---
# Headless service for StatefulSet (if needed)
apiVersion: v1
kind: Service
metadata:
  name: go-http-server-headless
  namespace: go-http-server
  labels:
    app.kubernetes.io/name: go-http-server
    app.kubernetes.io/component: api-server
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: go-http-server
    app.kubernetes.io/component: api-server
