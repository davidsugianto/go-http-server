apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: go-http-server

resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

# Common labels
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: application

# Images (override with kustomize edit set image)
images:
  - name: docker.io/idiots718/go-http-server
    newTag: latest
